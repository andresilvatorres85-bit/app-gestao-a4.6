name: Relatório de Conjuntura

on:
  schedule:
    # 08:03 de Brasilia (11:03 UTC), de segunda a sexta. O agendamento do
    # GitHub nao tem hora garantida (horarios cheios, como :00, chegam a
    # atrasar horas), entao ha horarios de reserva: o script so gera o
    # relatorio na primeira execucao do dia e ignora as demais. O disparo
    # exato das 08:00 vem do Supabase (supabase_conjuntura_cron.sql).
    - cron: "3 11 * * 1-5"
    - cron: "33 11 * * 1-5"
    - cron: "13 12 * * 1-5"
    - cron: "13 13 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Data do relatorio (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conjuntura
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install anthropic requests

      - name: Gerar relatorio e gravar no Supabase
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_RELATORIO: ${{ inputs.data }}
        run: python scripts/conjuntura.py
