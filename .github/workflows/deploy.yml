name: Deploy no GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 09:00 UTC = 06:00 no horario de Brasilia (UTC-3, sem horario de verao).
    # O agendamento do GitHub Actions roda em UTC e pode atrasar sob carga;
    # nao e garantido no minuto exato. Alem disso, o GitHub desativa o
    # agendamento apos ~60 dias sem commits no repositorio.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias do gerador
        run: pip install openpyxl

      - name: Gerar base LEXOR (baixa a planilha do repo de origem)
        env:
          # Forca o download da planilha do repositorio dados-gestao-a4.6
          # a cada execucao, ignorando qualquer copia local eventualmente commitada.
          LEXOR_XLSX: ""
        run: python gerar_lexor.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar (usa os Secrets do Supabase)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato buildado
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
